# `key` is the NAME of the env var holding the API key, never the key itself.
# `url` is the full versioned base: handlers.py appends only "/chat/completions",
# so providers that don't use a plain /v1 prefix (Gemini) are expressible here.
[apis.groq]
url = "https://api.groq.com/openai/v1"
key = "GROQ_API_KEY"

[apis.mistral]
url = "https://api.mistral.ai/v1"
key = "MISTRAL_API_KEY"

[apis.cerebras]
url = "https://api.cerebras.ai/v1"
key = "CEREBRAS_API_KEY"

[apis.gemini]
url = "https://generativelanguage.googleapis.com/v1beta/openai"
key = "GEMINI_API_KEY"

[apis.openrouter]
url = "https://openrouter.ai/api/v1"
key = "OPENROUTER_API_KEY"

# "local" is special-cased: active with no env var as long as `url` is
# non-empty, and appended as the last-resort fallback.
[apis.local]
url = "https://localhost:11433/v1"
key = ""

[[runners]]
api = "gemini"
model = "gemini-3.6-flash"
weight = 0.7

[[runners]]
api = "groq"
model = "llama-3.3-70b-versatile"
weight = 0.8

[[runners]]
api = "mistral"
model = "mistral-large-latest"
weight = 0.6
